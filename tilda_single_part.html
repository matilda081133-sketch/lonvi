    function renderAndActivate(rawHtml) {
        var container = document.getElementById('lonvi-landing-root');
        if (!container) return;

        // Use contextual fragment to parse HTML and preserve all tags
        var range = document.createRange();
        range.selectNode(container);
        var fragment = range.createContextualFragment(rawHtml);
        
        // Append all elements
        container.appendChild(fragment);

        // Execute all scripts inside container sequentially
        var scripts = Array.from(container.querySelectorAll('script'));
        function runNextScript(index) {
            if (index >= scripts.length) {
                // Trigger events so observers, forms, and modals bind properly
                try { document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true })); } catch(e) {}
                try { window.dispatchEvent(new Event('load')); } catch(e) {}
                try { window.dispatchEvent(new Event('resize')); } catch(e) {}
                return;
            }
            var oldSc = scripts[index];
            var newSc = document.createElement('script');
            if (oldSc.type) newSc.type = oldSc.type;
            if (oldSc.id) newSc.id = oldSc.id;

            if (oldSc.src) {
                newSc.src = oldSc.src;
                newSc.async = false;
                newSc.onload = function() { runNextScript(index + 1); };
                newSc.onerror = function() { runNextScript(index + 1); };
                oldSc.parentNode.replaceChild(newSc, oldSc);
            } else {
                newSc.textContent = oldSc.textContent;
                oldSc.parentNode.replaceChild(newSc, oldSc);
                runNextScript(index + 1);
            }
        }
        runNextScript(0);
    }

    // Native fast decompression (all modern browsers)
    if (typeof DecompressionStream !== 'undefined') {
        try {
            var binStr = atob(b64Payload);
            var byteArr = new Uint8Array(binStr.length);
            for (var i = 0; i < binStr.length; i++) byteArr[i] = binStr.charCodeAt(i);

            var stream = new Response(new Blob([byteArr]).stream().pipeThrough(new DecompressionStream('gzip')));
            stream.text().then(function(decompressed) {
                renderAndActivate(decompressed);
            }).catch(function(err) {
                console.error("Decompress stream error:", err);
            });
        } catch (e) {
            console.error("Decompression init error:", e);
        }
    } else {
        // Fallback for legacy browsers
        var script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js";
        script.onload = function() {
            var binStr = atob(b64Payload);
            var byteArr = new Uint8Array(binStr.length);
            for (var i = 0; i < binStr.length; i++) byteArr[i] = binStr.charCodeAt(i);
            var decompressed = pako.ungzip(byteArr, { to: 'string' });
            renderAndActivate(decompressed);
        };
        document.head.appendChild(script);
    }
