<!-- LONVI LANDING — DYNAMIC FAST LOADER (TILDA T123) -->
<!-- Этот код можно вставить в 1 блок T123. Он всегда автоматически подгружает актуальный код сайта с GitHub/CDN. -->
<div id="lonvi-landing-root" style="min-height: 100vh; background-color: #000000; color: #ffffff;">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: monospace; color: #C1A066; font-size: 14px; letter-spacing: 0.2em;">
        LONVI BIOSCIENCES • ЗАГРУЗКА...
    </div>
</div>

<script>
(function() {
    // URL к актуальной версии лендинга
    var url = 'https://cdn.jsdelivr.net/gh/matilda081133-sketch/lonvi@main/index.html?v=' + Date.now();
    
    function runScripts(container) {
        var scripts = Array.from(container.querySelectorAll('script'));
        var styles = Array.from(container.querySelectorAll('link[rel="stylesheet"], style'));
        
        styles.forEach(function(s) {
            document.head.appendChild(s);
        });
        
        function executeScript(idx) {
            if (idx >= scripts.length) {
                try {
                    var evt = new Event('DOMContentLoaded', { bubbles: true, cancelable: true });
                    document.dispatchEvent(evt);
                } catch(e) {}
                try {
                    window.dispatchEvent(new Event('resize'));
                } catch(e) {}
                return;
            }
            var oldScript = scripts[idx];
            var newScript = document.createElement('script');
            if (oldScript.type) newScript.type = oldScript.type;
            if (oldScript.id) newScript.id = oldScript.id;
            
            if (oldScript.src) {
                newScript.src = oldScript.src;
                newScript.async = false;
                newScript.onload = function() { executeScript(idx + 1); };
                newScript.onerror = function() { executeScript(idx + 1); };
                oldScript.parentNode.replaceChild(newScript, oldScript);
            } else {
                newScript.textContent = oldScript.textContent;
                oldScript.parentNode.replaceChild(newScript, oldScript);
                executeScript(idx + 1);
            }
        }
        
        executeScript(0);
    }

    fetch(url)
        .then(function(r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.text();
        })
        .then(function(html) {
            var root = document.getElementById('lonvi-landing-root');
            if (!root) return;
            
            var parser = new DOMParser();
            var doc = parser.parseFromString(html, 'text/html');
            
            root.innerHTML = '';
            var fragment = document.createDocumentFragment();
            while (doc.body.firstChild) {
                fragment.appendChild(doc.body.firstChild);
            }
            root.appendChild(fragment);
            
            runScripts(root);
        })
        .catch(function(err) {
            console.error('Lonvi loader error:', err);
        });
})();
</script>
